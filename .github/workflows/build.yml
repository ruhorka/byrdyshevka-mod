name: Build Byrdyshevka Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Extract mod source
        run: |
          mkdir -p /tmp/source
          unzip -q ./byrdyshevka-fabric-1.21.11-ready.zip -d /tmp/source

          SRC=$(find /tmp/source -path '*/src/main/java' -type d | head -n 1)
          RES=$(find /tmp/source -path '*/src/main/resources' -type d | head -n 1)

          test -n "$SRC"
          test -n "$RES"

          mkdir -p source
          cp -r "$SRC" source/java
          cp -r "$RES" source/resources

      - name: Download Fabric template
        run: |
          git clone --depth 1 --branch 1.21.11 https://github.com/FabricMC/fabric-example-mod.git /tmp/mod

          rm -rf /tmp/mod/src/main
          rm -rf /tmp/mod/src/client

          mkdir -p /tmp/mod/src/main
          cp -r source/java /tmp/mod/src/main/java
          cp -r source/resources /tmp/mod/src/main/resources

          sed -i 's/mappings loom.officialMojangMappings()/mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"/' /tmp/mod/build.gradle

          echo 'yarn_mappings=1.21.11+build.3' >> /tmp/mod/gradle.properties

          sed -i 's/^mod_version=.*/mod_version=1.0.0/; s/^maven_group=.*/maven_group=com.example.byrdyshevka/' /tmp/mod/gradle.properties

      - name: Build JAR
        run: |
          cd /tmp/mod
          ./gradlew build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: byrdyshevka-jar
          path: /tmp/mod/build/libs/*.jar
